name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read Dynamicweb floor from csproj
        shell: pwsh
        run: |
          $floor = (dotnet msbuild src/Truvio.Commerce.BuyingAssistant/Truvio.Commerce.BuyingAssistant.csproj -nologo -getProperty:DynamicwebVersion).Trim()
          Write-Host "Dynamicweb floor read from csproj: $floor"
          Add-Content -Path $env:GITHUB_ENV -Value "DW_FLOOR=$floor"
      - name: Test
        run: dotnet test tests/Truvio.Commerce.BuyingAssistant.Tests --configuration Release -p:DynamicwebVersion=${{ env.DW_FLOOR }}
      - name: Pack
        run: dotnet pack src/Truvio.Commerce.BuyingAssistant/Truvio.Commerce.BuyingAssistant.csproj --configuration Release -p:DynamicwebVersion=${{ env.DW_FLOOR }} --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
